<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>数据桥</title></head>
<body>
<script>
/* 沙箱数据桥（被主页面以 sandbox="allow-scripts" 的隐藏 iframe 加载）
 * 原理：本页面处于不透明源（opaque origin），对云端的 fetch 请求 Origin 为 null；
 * 云端网关放行 null 并回显 Access-Control-Allow-Origin: null，浏览器可读响应。
 * 而 GitHub Pages 页面自身源不在网关白名单（403），微信 UA 又被平台边缘层
 * 拦截 /cp 之类的普通路径（但不拦 /.cloud），故由本桥代发云端请求。 */
(function () {
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.__ttReq !== 1 || e.source !== window.parent) return;
    var opt = { method: d.method || 'GET', headers: d.headers || {} };
    if (d.body != null && d.method !== 'GET' && d.method !== 'HEAD') opt.body = d.body;
    fetch(d.url, opt).then(function (r) {
      return r.text().then(function (t) {
        var hs = {};
        r.headers.forEach(function (v, k) { hs[k] = v; });
        parent.postMessage({ __tt: 1, id: d.id, status: r.status, ok: r.ok, statusText: r.statusText, headers: hs, body: t }, '*');
      });
    }).catch(function (err) {
      parent.postMessage({ __tt: 1, id: d.id, err: String((err && err.message) || err) }, '*');
    });
  });
})();
</script>
</body>
</html>
